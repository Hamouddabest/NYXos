name: Android NDK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Cross-Compile Swift for Android ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Swift Toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Swift Android SDK
        run: |
          swift sdk install https://source.skip.tools/swift-android-toolchain/releases/download/6.0.3/swift-6.0.3-RELEASE-android-24-0.1.artifactbundle.tar.gz --checksum 4566f23ae2d36dc5c02e915cd67d83b2af971faca4b2595fdd75cf0286acfac1

      - name: Build NyxOS Core for Android (ARM64)
        run: |
          export NDK_PATH=$ANDROID_NDK_HOME
          swift build --swift-sdk aarch64-unknown-linux-android24 -c release

      - name: Upload Native Android Binaries (.so)
        uses: actions/upload-artifact@v4
        with:
          name: nyxos-android-arm64-binaries
          path: .build/aarch64-unknown-linux-android24/release/
