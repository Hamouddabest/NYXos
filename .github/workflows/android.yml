name: Android NDK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Cross-Compile Swift for Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Swift Package for Android
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: '6.0'
          swift-configuration: 'release'
          run-tests: false

      - name: Upload Native Android Binaries (.so)
        uses: actions/upload-artifact@v4
        with:
          name: nyxos-android-arm64-binaries
          path: .build/
