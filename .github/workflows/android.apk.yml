name: Build Android APK

on:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Swift & Build Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Swift Toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Swift Android SDK
        run: |
          swift sdk install https://source.skip.tools/swift-android-toolchain/releases/download/6.0.3/swift-6.0.3-RELEASE-android-24-0.1.artifactbundle.tar.gz --checksum 4566f23ae2d36dc5c02e915cd67d83b2af971faca4b2595fdd75cf0286acfac1

      - name: Check and Compile Swift Sources
        run: |
          if [ ! -f "Package.swift" ]; then
            echo "No Package.swift found. Creating dynamic Swift Package manifest..."
            swift package init --type library --name NyxOS
          fi

          swift build --swift-sdk aarch64-unknown-linux-android24 -c release

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android App Wrapper Structure
        run: |
          mkdir -p android-app/app/src/main/java/com/nyxos/app
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a

          cp .build/aarch64-unknown-linux-android24/release/*.so android-app/app/src/main/jniLibs/arm64-v8a/ || true

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.nyxos.app">
              <application
                  android:label="NyxOS"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/nyxos/app/MainActivity.kt
          package com.nyxos.app

          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView

          class MainActivity : Activity() {
              companion object {
                  init {
                      System.loadLibrary("NyxOS")
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "NyxOS Running Natively on Android! 🚀"
                  tv.textSize = 22f
                  setContentView(tv)
              }
          }
          EOF

          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NyxOSApp"
          include ':app'
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              compileSdk 34
              namespace 'com.nyxos.app'
              defaultConfig {
                  applicationId "com.nyxos.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > android-app/build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF

          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-app/local.properties

      - name: Build with Gradle 8.5 & Generate APK
        run: |
          cd android-app
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          unset ANDROID_SDK_ROOT
          
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK as Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: NyxOS Android v1.0 (Build ${{ github.run_number }})
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          body: "Automated native build of NyxOS for Android. Download `app-debug.apk` below to install."
