name: Build NyxOS Android APK (Native SwiftUI)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Native SwiftUI Cross-Compile & Single Release
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 & Android SDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Skip (SwiftUI Transpiler Engine)
        run: |
          brew install skiptools/skip/skip
          skip --help

      - name: Wipe All Duplicate Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="nyxos-android-latest"
          
          # Delete target release if present
          gh release delete "$TAG_NAME" --repo ${{ github.repository }} --yes || true
          
          # Delete remote tag if present
          git push origin --delete "$TAG_NAME" || true
          
          # Delete local tag if present
          git tag -d "$TAG_NAME" || true
          
          # Wipe all older build version tags (v1.0-*)
          for tag in $(git tag -l "v1.0-*"); do
            gh release delete "$tag" --repo ${{ github.repository }} --yes || true
            git push origin --delete "$tag" || true
            git tag -d "$tag" || true
          done

      - name: Write Privacy Entitlements (Info.plist Fix)
        run: |
          mkdir -p Sources/NyxOS
          cat << 'EOF' > Sources/NyxOS/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>NyxOS requires GPS location access for the Weather, Locations, and Qibla Tracker apps.</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>NyxOS requires real-time location vectors for system diagnostics.</string>
              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>NyxOS requires Bluetooth peripheral connectivity for active audio status.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>NyxOS requires media access for the Photos gallery.</string>
              <key>NSCameraUsageDescription</key>
              <string>NyxOS requires camera access for system snapshots.</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>NyxOS requires microphone access for screen recording audio.</string>
          </dict>
          </plist>
          EOF

