          struct CalculatorAppView: View {
              @ObservedObject var viewModel: NyxOSViewModel
              @ObservedObject var audioEngine: NyxAudioEngine
              @State private var displayValue: String = "0"
              @State private var currentOperation: String = ""
              @State private var firstOperand: Double = 0
              
              var body: some View {
                  VStack(spacing: 8) {
                      HStack {
                          Spacer()
                          Text(displayValue)
                              .font(.system(size: 28, weight: .bold, design: .monospaced))
                              .foregroundColor(.white)
                      }
                      .padding(12)
                      .background(getBackgroundView(for: viewModel.osMode))
                      .clipShape(RoundedRectangle(cornerRadius: 12))
                      .overlay(RoundedRectangle(cornerRadius: 12).stroke(Color.white.opacity(0.2), lineWidth: 1))
                      .padding(.horizontal, 12)
                      
                      let buttons = [
                          ["7", "8", "9", "/"],
                          ["4", "5", "6", "*"],
                          ["1", "2", "3", "-"],
                          ["C", "0", "=", "+"]
                      ]
                      
                      ForEach(buttons, id: \.self) { row in
                          HStack(spacing: 8) {
                              ForEach(row, id: \.self) { btn in
                                  Button(action: {
                                      audioEngine.playClickHaptic()
                                      handleButtonPress(btn)
                                  }) {
                                      Text(btn)
                                          .font(.system(size: 12, weight: .bold))
                                          .frame(maxWidth: .infinity, minHeight: 32)
                                          .background(getBackgroundView(for: viewModel.osMode))
                                          .foregroundColor(.white)
                                          .clipShape(RoundedRectangle(cornerRadius: 8))
                                          .overlay(RoundedRectangle(cornerRadius: 8).stroke(Color.white.opacity(0.2), lineWidth: 1))
                                  }
                              }
                          }
                          .padding(.horizontal, 12)
                      }
                      Spacer()
                  }
                  .padding(.top, 10)
              }
              
              private func handleButtonPress(_ btn: String) {
                  if btn == "C" {
                      displayValue = "0"
                      firstOperand = 0
                      currentOperation = ""
                  } else if let _ = Double(btn) {
                      if displayValue == "0" { displayValue = btn }
                      else { displayValue += btn }
                  } else if btn == "=" {
                      if let val = Double(displayValue) {
                          if currentOperation == "+" { displayValue = "\(firstOperand + val)" }
                          else if currentOperation == "-" { displayValue = "\(firstOperand - val)" }
                          else if currentOperation == "*" { displayValue = "\(firstOperand * val)" }
                          else if currentOperation == "/" { displayValue = val != 0 ? "\(firstOperand / val)" : "Error" }
                      }
                  } else {
                      if let val = Double(displayValue) {
                          firstOperand = val
                          currentOperation = btn
                          displayValue = "0"
                      }
                  }
              }
          }

