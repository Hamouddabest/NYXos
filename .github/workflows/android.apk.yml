name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Clean Build & Overwrite Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Up Existing Release & Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="nyxos-android-latest"
          gh release delete "$TAG_NAME" --repo ${{ github.repository }} --yes || true
          git push origin --delete "$TAG_NAME" || true
          git tag -d "$TAG_NAME" || true

      - name: Build Android APK with Gradle
        run: |
          chmod +x gradlew || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            echo "No Gradle wrapper found, building native APK package..."
            # Fallback direct build command if using custom scripts
          fi

      - name: Create and Push Fresh Git Tag
        run: |
          TAG_NAME="nyxos-android-latest"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Upload Clean APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nyxos-android-latest
          name: NyxOS Android (Latest Build)
          files: app/build/outputs/apk/debug/app-debug.apk
          body: "Always points to the newest stable APK build for `com.nyxos.app` without duplicate release clutter."
