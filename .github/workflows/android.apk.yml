          struct HorizonWebBrowserView: View {
              @ObservedObject var viewModel: NyxOSViewModel
              @ObservedObject var networkMonitor: RealNetworkMonitor
              
              @State private var urlString: String = "nyx://home"
              @State private var currentURL: URL = URL(string: "https://www.wikipedia.org")!
              @State private var isCustomHome: Bool = true
              
              var body: some View {
                  VStack(spacing: 0) {
                      HStack(spacing: 6) {
                          Image(systemName: "globe").foregroundColor(Color.cyan).font(.system(size: 10))
                          TextField("Enter website URL...", text: $urlString)
                              .font(.system(size: 10, design: .monospaced))
                              .foregroundColor(viewModel.isLightMode ? .black : .white)
                              .autocapitalization(.none)
                              .disableAutocorrection(true)
                              .onSubmit { loadWebURL() }
                          
                          Button("Go") { loadWebURL() }
                              .font(.system(size: 9, weight: .bold))
                              .foregroundColor(Color.cyan)
                      }
                      .padding(8)
                      .background(getBackgroundView(for: viewModel.osMode))
                      
                      if isCustomHome {
                          VStack(spacing: 14) {
                              Spacer()
                              Image(systemName: "sparkles").font(.system(size: 40)).foregroundColor(.cyan)
                              Text("NYX HORIZON BROWSER").font(.system(size: 12, weight: .bold, design: .monospaced)).foregroundColor(viewModel.isLightMode ? .black : .white)
                              Text("Enter any web URL above or download packages.").font(.system(size: 9)).foregroundColor(.gray)
                              
                              HStack(spacing: 10) {
                                  Button("Download Game.ipa") {
                                      urlString = "https://nyxos.store/game.ipa"
                                      viewModel.addDownloadedFileFromHorizon(filename: "GameClient.ipa")
                                  }
                                  .font(.system(size: 8, weight: .bold))
                                  .padding(.horizontal, 10).padding(.vertical, 6)
                                  .background(Color.cyan.opacity(0.2))
                                  .foregroundColor(.cyan)
                                  .clipShape(Capsule())
                                  
                                  Button("Download Setup.exe") {
                                      urlString = "https://nyxos.store/setup.exe"
                                      viewModel.addDownloadedFileFromHorizon(filename: "AppSetup.exe")
                                  }
                                  .font(.system(size: 8, weight: .bold))
                                  .padding(.horizontal, 10).padding(.vertical, 6)
                                  .background(Color.blue.opacity(0.2))
                                  .foregroundColor(.blue)
                                  .clipShape(Capsule())
                              }
                              Spacer()
                          }
                          .frame(maxWidth: .infinity, maxHeight: .infinity)
                      } else {
                          RealWebViewRepresentable(url: $currentURL)
                      }
                  }
              }
              
              private func loadWebURL() {
                  var formatted = urlString.trimmingCharacters(in: .whitespacesAndNewlines)
                  if formatted == "nyx://home" || formatted.isEmpty {
                      isCustomHome = true
                      return
                  }
                  if !formatted.hasPrefix("http://") && !formatted.hasPrefix("https://") && !formatted.hasPrefix("file://") {
                      formatted = "https://" + formatted
                  }
                  if let u = URL(string: formatted) {
                      isCustomHome = false
                      currentURL = u
                      urlString = u.absoluteString
                      
                      if formatted.hasSuffix(".ipa") || formatted.hasSuffix(".apk") || formatted.hasSuffix(".exe") || formatted.hasSuffix(".zip") {
                          let lastComponent = u.lastPathComponent
                          viewModel.addDownloadedFileFromHorizon(filename: lastComponent.isEmpty ? "DownloadFile.zip" : lastComponent)
                      }
                  }
              }
          }

          struct RealWebViewRepresentable: UIViewRepresentable {
              @Binding var url: URL
              func makeUIView(context: Context) -> WKWebView {
                  let wv = WKWebView()
                  wv.load(URLRequest(url: url))
                  return wv
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {
                  if uiView.url != url {
                      uiView.load(URLRequest(url: url))
                  }
              }
          }

          struct AetherToolsetView: View {
              @ObservedObject var viewModel: NyxOSViewModel
              @State private var logs: [String] = ["Aether Toolset Diagnostics Active."]
              @State private var input: String = ""
              
              var body: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      ScrollView {
                          VStack(alignment: .leading) {
                              ForEach(logs, id: \.self) { l in Text(l).font(.system(size: 10, design: .monospaced)).foregroundColor(Color.green) }
                          }
                      }
                      HStack {
                          Text("Aether>").foregroundColor(Color.green)
                          TextField("command...", text: $input)
                              .font(.system(size: 10, design: .monospaced))
                              .foregroundColor(viewModel.isLightMode ? .black : .white)
                              .autocapitalization(.none)
                              .onSubmit {
                                  let cmd = input.trimmingCharacters(in: .whitespacesAndNewlines)
                                  let upperCmd = cmd.uppercased()
                                  logs.append("Aether> \(input)")
                                  
                                  if upperCmd == "NYXSUS" {
                                      logs.append("[EXPLOIT] Injecting root exploit payload...")
                                      logs.append("[REBOOT] Restarting device to apply changes...")
                                      viewModel.triggerJailbreakReboot()
                                  } else if upperCmd == "DISABLE NYXSUS" {
                                      logs.append("[UNROOT] Removing root exploit payload...")
                                      logs.append("[REBOOT] Restarting to stock unjailbroken state...")
                                      viewModel.triggerRemoveJailbreakReboot()
                                  } else if upperCmd == "ACCESS DOWNLOADS" {
                                      viewModel.showDownloadsAppUnlocked = true
                                      logs.append("[SUCCESS] Downloads app unlocked.")
                                  } else if upperCmd == "SIDESTORE…" || cmd == "sidestore…" || upperCmd == "SIDESTORE..." || upperCmd == "SIDESTORE" {
                                      viewModel.showNyxSignUnlocked = true
                                      logs.append("[SUCCESS] NyxSign (SideStore) unlocked and added to Home Screen!")
                                  } else {
                                      logs.append("Error: Command not recognized.")
                                  }
                                  input = ""
                              }
                      }
                      .padding(6)
                      .background(getBackgroundView(for: viewModel.osMode))
                  }
                  .padding(10)
              }
