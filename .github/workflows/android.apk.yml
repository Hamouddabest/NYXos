              @State private var activeContextMenuApp: NyxApp? = nil
              @State private var orderedApps: [NyxApp] = NyxApp.allCases
              
              var body: some View {
                  ZStack {
                      VStack(spacing: 8) {
                          Spacer().frame(height: 35)
                          
                          HStack {
                              Image(systemName: "magnifyingglass").foregroundColor(.gray).font(.system(size: 11))
                              TextField("Search App Library...", text: $viewModel.searchFilterText)
                                  .font(.system(size: 10))
                                  .foregroundColor(viewModel.isLightMode ? .black : .white)
                          }
                          .padding(8)
                          .background(getBackgroundView(for: viewModel.osMode))
                          .padding(.horizontal, 16)
                          
                          let allVisibleApps = getVisibleApps()
                          let itemsPerPage = viewModel.isLandscape ? 10 : 12
                          let columnCount = viewModel.isLandscape ? 5 : 3
                          let pages = chunk(allVisibleApps, into: itemsPerPage)
                          
                          TabView {
                              ForEach(0..<max(1, pages.count), id: \.self) { pageIndex in
                                  let pageApps = pages.indices.contains(pageIndex) ? pages[pageIndex] : []
                                  
                                  LazyVGrid(columns: Array(repeating: GridItem(.flexible(), spacing: 14), count: columnCount), spacing: 14) {
                                      ForEach(pageApps) { appItem in
                                          renderAppIcon(item: appItem)
                                      }
                                  }
                                  .padding(.horizontal, 16)
                                  .padding(.top, 12)
                                  .frame(maxHeight: .infinity, alignment: .top)
                              }
                          }
                          .tabViewStyle(PageTabViewStyle(indexDisplayMode: .always))
                          
                          Spacer()
                      }
                      
                      if let app = activeContextMenuApp {
                          Color.black.opacity(0.4).ignoresSafeArea()
                              .onTapGesture { activeContextMenuApp = nil }
                              .zIndex(500)
                          
                          VStack(spacing: 6) {
                              Text(app.rawValue).font(.system(size: 11, weight: .bold)).foregroundColor(.white).padding(.bottom, 4)
                              
                              Button("Set Custom Icon") {
                                  audioEngine.playClickHaptic()
                                  viewModel.customAppIcons[app.rawValue] = "star.fill"
                                  activeContextMenuApp = nil
                              }
                              .font(.system(size: 9, weight: .bold))
                              .frame(maxWidth: .infinity, minHeight: 30)
                              .background(Color.cyan.opacity(0.3))
                              .foregroundColor(.cyan)
                              .clipShape(RoundedRectangle(cornerRadius: 8))
                              
                              Button("Hide App") {
                                  audioEngine.playClickHaptic()
                                  viewModel.hiddenApps.insert(app.rawValue)
                                  activeContextMenuApp = nil
                              }
                              .font(.system(size: 9, weight: .bold))
                              .frame(maxWidth: .infinity, minHeight: 30)
                              .background(Color.orange.opacity(0.3))
                              .foregroundColor(.orange)
                              .clipShape(RoundedRectangle(cornerRadius: 8))
                              
                              Button("Remove from Home Screen") {
                                  audioEngine.playClickHaptic()
                                  viewModel.deletedApps.insert(app.rawValue)
                                  activeContextMenuApp = nil
                              }
                              .font(.system(size: 9, weight: .bold))
                              .frame(maxWidth: .infinity, minHeight: 30)
                              .background(Color.red.opacity(0.3))
                              .foregroundColor(.red)
                              .clipShape(RoundedRectangle(cornerRadius: 8))
                              
                              Button("Cancel") {
                                  activeContextMenuApp = nil
                              }
                              .font(.system(size: 9))
                              .foregroundColor(.gray)
                              .padding(.top, 4)
                          }
                          .padding(16)
                          .frame(width: 220)
                          .background(.ultraThinMaterial)
                          .clipShape(RoundedRectangle(cornerRadius: 16))
                          .shadow(radius: 20)
                          .zIndex(510)
                      }
                  }
              }
              
              enum AppItemType {
                  case standard(NyxApp)
                  case customAi(CustomAIApp)
                  case sideload(SideloaderGame)
                  case store(StoreApp)
              }
              
              struct HomeAppIdentifier: Identifiable {
                  let id = UUID()
                  let type: AppItemType
                  let rawKey: String
              }
              
              private func getVisibleApps() -> [HomeAppIdentifier] {
                  var items: [HomeAppIdentifier] = []
                  
                  for app in orderedApps {
                      let localizedName = viewModel.currentLanguage.localizedAppName(app)
                      let matchesSearch = viewModel.searchFilterText.isEmpty || localizedName.localizedCaseInsensitiveContains(viewModel.searchFilterText)
                      let isRootApp = (app == .nyxManager || app == .nyxSign)
                      let allowedToShow: Bool = {
                          if app == .nyxSign { return viewModel.showNyxSignUnlocked }
                          if isRootApp { return viewModel.isJailbroken }
                          return true
                      }()
                      
                      if (app != .downloads || viewModel.showDownloadsAppUnlocked) &&
                         allowedToShow &&
                         (!viewModel.hiddenApps.contains(app.rawValue) || !viewModel.searchFilterText.isEmpty) &&
                         !viewModel.deletedApps.contains(app.rawValue) &&
                         matchesSearch {
                          items.append(HomeAppIdentifier(type: .standard(app), rawKey: app.rawValue))
                      }
                  }
                  
                  for customApp in viewModel.customAiApps.filter({ $0.isDownloaded }) {
                      let matchesSearch = viewModel.searchFilterText.isEmpty || customApp.name.localizedCaseInsensitiveContains(viewModel.searchFilterText)
                      if matchesSearch {
                          items.append(HomeAppIdentifier(type: .customAi(customApp), rawKey: customApp.name))
                      }
                  }
                  
                  for sideloadItem in viewModel.sideloadedGames.filter({ $0.isInstalledOnHomescreen }) {
                      let matchesSearch = viewModel.searchFilterText.isEmpty || sideloadItem.title.localizedCaseInsensitiveContains(viewModel.searchFilterText)
                      if matchesSearch {
                          items.append(HomeAppIdentifier(type: .sideload(sideloadItem), rawKey: sideloadItem.title))
                      }
                  }
                  
                  for storeApp in viewModel.storeCatalog.filter({ $0.isInstalled }) {
                      let matchesSearch = viewModel.searchFilterText.isEmpty || storeApp.name.localizedCaseInsensitiveContains(viewModel.searchFilterText)
                      if matchesSearch {
                          items.append(HomeAppIdentifier(type: .store(storeApp), rawKey: storeApp.name))
                      }
                  }
                  
                  return items
              }
              
              private func chunk(_ array: [HomeAppIdentifier], into size: Int) -> [[HomeAppIdentifier]] {
                  stride(from: 0, to: array.count, by: size).map {
                      Array(array[$0 ..< Swift.min($0 + size, array.count)])
                  }
              }
              
              @ViewBuilder
              private func renderAppIcon(item: HomeAppIdentifier) -> some View {
                  switch item.type {
                  case .standard(let app):
                      let localizedName = viewModel.currentLanguage.localizedAppName(app)
                      let iconToUse = viewModel.customAppIcons[app.rawValue] ?? app.defaultIcon
                      Button(action: {
                          audioEngine.playClickHaptic()
                          withAnimation(.spring(response: 0.3, dampingFraction: 0.6)) { viewModel.activeApp = app }
                      }) {
                          VStack(spacing: 3) {
                              ZStack {
                                  RoundedRectangle(cornerRadius: viewModel.osMode == .android ? 18 : 14)
                                      .fill(getBackgroundShapeStyle(for: viewModel.osMode == .ios18 ? .ios18 : .android))
                                      .frame(width: 48, height: 48)
                                      .overlay(
                                          RoundedRectangle(cornerRadius: viewModel.osMode == .android ? 18 : 14)
                                              .stroke(
                                                  LinearGradient(colors: [app.accentColor.opacity(0.8), .white.opacity(0.4)], startPoint: .topLeading, endPoint: .bottomTrailing),
                                                  lineWidth: viewModel.osMode == .ios18 ? 1.5 : 1.0
                                              )
                                      )
                                      .shadow(color: app.accentColor.opacity(viewModel.osMode == .ios18 ? 0.5 : 0.35), radius: viewModel.osMode == .ios18 ? 8 : 6, x: 0, y: 3)
                                  
                                  Image(systemName: iconToUse)
                                      .font(.system(size: 20, weight: .semibold))
                                      .foregroundColor(app.accentColor)
                                      .shadow(color: app.accentColor.opacity(0.6), radius: 4)
                              }
                              Text(localizedName)
                                  .font(.system(size: 8, weight: .medium))
                                  .foregroundColor(viewModel.isLightMode ? .black : .white)
                                  .lineLimit(1)
                                  .frame(width: 70)
                          }
                      }
                      .buttonStyle(ScaleButtonStyle())
                      .simultaneousGesture(
                          LongPressGesture(minimumDuration: 0.5).onEnded { _ in
                              audioEngine.playClickHaptic()
                              activeContextMenuApp = app
                          }
                      )
                      
                  case .customAi(let customApp):
                      Button(action: {
                          audioEngine.playClickHaptic()
                          withAnimation(.spring(response: 0.3, dampingFraction: 0.6)) { viewModel.activeCustomAiApp = customApp }
                      }) {
                          VStack(spacing: 3) {
                              ZStack {
                                  RoundedRectangle(cornerRadius: 14)
                                      .fill(getBackgroundShapeStyle(for: viewModel.osMode == .ios18 ? .ios18 : .android))
                                      .frame(width: 48, height: 48)
                                      .overlay(RoundedRectangle(cornerRadius: 14).stroke(Color.cyan.opacity(0.6), lineWidth: 1.5))
                                      .shadow(color: Color.cyan.opacity(0.4), radius: 6)
                                  Image(systemName: customApp.icon)
                                      .font(.system(size: 20, weight: .semibold))
                                      .foregroundColor(.cyan)
                              }
                              Text(customApp.name)
                                  .font(.system(size: 8, weight: .medium))
                                  .foregroundColor(viewModel.isLightMode ? .black : .white)
                                  .lineLimit(1)
                                  .frame(width: 70)
                          }
                      }
                      .buttonStyle(ScaleButtonStyle())
                      
                  case .sideload(let sideloadItem):
                      Button(action: {
                          audioEngine.playClickHaptic()
                          withAnimation(.spring(response: 0.3, dampingFraction: 0.6)) { viewModel.activeSideloadGame = sideloadItem }
                      }) {
                          VStack(spacing: 3) {
                              ZStack {
                                  RoundedRectangle(cornerRadius: 14)
                                      .fill(getBackgroundShapeStyle(for: viewModel.osMode == .ios18 ? .ios18 : .android))
                                      .frame(width: 48, height: 48)
                                      .overlay(RoundedRectangle(cornerRadius: 14).stroke(Color.red.opacity(0.6), lineWidth: 1.5))
                                      .shadow(color: Color.red.opacity(0.4), radius: 6)
                                  Image(systemName: "gamecontroller.fill")
                                      .font(.system(size: 20, weight: .semibold))
                                      .foregroundColor(.red)
                              }
                              Text(sideloadItem.title)
                                  .font(.system(size: 8, weight: .medium))
                                  .foregroundColor(viewModel.isLightMode ? .black : .white)
                                  .lineLimit(1)
                                  .frame(width: 70)
                          }
                      }
                      .buttonStyle(ScaleButtonStyle())
                      
                  case .store(let storeApp):
                      Button(action: {
                          audioEngine.playClickHaptic()
                          if storeApp.isGame { viewModel.activeStoreAppGame = storeApp }
                          else if storeApp.isExeApp { viewModel.activeExeApp = storeApp }
                      }) {
                          VStack(spacing: 3) {
                              ZStack {
                                  RoundedRectangle(cornerRadius: 14)
                                      .fill(getBackgroundShapeStyle(for: viewModel.osMode == .ios18 ? .ios18 : .android))
                                      .frame(width: 48, height: 48)
                                      .overlay(RoundedRectangle(cornerRadius: 14).stroke(storeApp.accent.opacity(0.6), lineWidth: 1.5))
                                      .shadow(color: storeApp.accent.opacity(0.4), radius: 6)
                                  Image(systemName: storeApp.icon)
                                      .font(.system(size: 20, weight: .semibold))
                                      .foregroundColor(storeApp.accent)
                              }
                              Text(storeApp.name)
                                  .font(.system(size: 8, weight: .medium))
                                  .foregroundColor(viewModel.isLightMode ? .black : .white)
                                  .lineLimit(1)
                                  .frame(width: 70)
                          }
                      }
                      .buttonStyle(ScaleButtonStyle())
                  }
              }
