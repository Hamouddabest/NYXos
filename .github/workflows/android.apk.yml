          final class RealNetworkMonitor: NSObject, ObservableObject, CLLocationManagerDelegate, CBCentralManagerDelegate {
              private let monitor = NWPathMonitor()
              private let queue = DispatchQueue(label: "NyxNetworkMonitorQueue")
              private let locationManager = CLLocationManager()
              private var centralManager: CBCentralManager!
              
              @Published var isConnected: Bool = true
              @Published var connectionType: String = "Wi-Fi"
              @Published var currentWifiSSID: String = "Active Wi-Fi Network"
              @Published var discoveredBluetoothDevices: [String] = []
              @Published var deviceCoordinates: String = "Lat: 24.4539° N, Lon: 39.6142° E (Mocked)"
              
              override init() {
                  super.init()
                  locationManager.delegate = self
                  locationManager.desiredAccuracy = kCLLocationAccuracyBest
                  
                  let status = locationManager.authorizationStatus
                  if status == .notDetermined {
                      locationManager.requestWhenInUseAuthorization()
                  }
                  if status == .authorizedWhenInUse || status == .authorizedAlways {
                      locationManager.startUpdatingLocation()
                  }
                  
                  centralManager = CBCentralManager(delegate: self, queue: nil)
                  
                  monitor.pathUpdateHandler = { [weak self] path in
                      DispatchQueue.main.async {
                          self?.isConnected = (path.status == .satisfied)
                          if path.usesInterfaceType(.wifi) {
                              self?.connectionType = "Wi-Fi"
                              self?.currentWifiSSID = "Connected Wi-Fi Interface"
                          } else if path.usesInterfaceType(.cellular) {
                              self?.connectionType = "Cellular"
                              self?.currentWifiSSID = "Cellular Data Network"
                          } else {
                              self?.connectionType = "Offline"
                              self?.currentWifiSSID = "No Active Link"
                          }
                      }
                  }
                  monitor.start(queue: queue)
              }
              
              func centralManagerDidUpdateState(_ central: CBCentralManager) {
                  if central.state == .poweredOn {
                      central.scanForPeripherals(withServices: nil, options: nil)
                  } else {
                      DispatchQueue.main.async {
                          self.discoveredBluetoothDevices = ["Bluetooth Hardware Powered Off"]
                      }
                  }
              }
              
              func centralManager(_ central: CBCentralManager, didDiscover peripheral: CBPeripheral, advertisementData: [String : Any], rssi RSSI: NSNumber) {
                  let name = peripheral.name ?? "Unnamed BLE Peripheral"
                  DispatchQueue.main.async {
                      if !self.discoveredBluetoothDevices.contains(name) {
                          self.discoveredBluetoothDevices.append(name)
                      }
                  }
              }
              
              func locationManager(_ manager: CLLocationManager, didUpdateLocations locations: [CLLocation]) {
                  guard let loc = locations.last else { return }
                  DispatchQueue.main.async {
                      self.deviceCoordinates = String(format: "Lat: %.4f° N, Lon: %.4f° E", loc.coordinate.latitude, loc.coordinate.longitude)
                  }
              }
          }

          final class NyxAudioEngine: ObservableObject {
              func playClickHaptic() { UIImpactFeedbackGenerator(style: .light).impactOccurred() }
              func playLockChime() { UINotificationFeedbackGenerator().notificationOccurred(.success) }
              func playShutterSound() { UINotificationFeedbackGenerator().notificationOccurred(.warning) }
          }

          final class NyxOSViewModel: ObservableObject {
