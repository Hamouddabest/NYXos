      - name: Build Android Debug APK with Skip
        run: |
          mkdir -p output
          skip gradle assembleDebug || (gradlew assembleDebug || ./gradlew assembleDebug)
          
          FOUND_APK=$(find . -name "*debug*.apk" -type f | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" output/NyxOS-Android.apk
            echo "Successfully generated native APK at: output/NyxOS-Android.apk"
          else
            echo "Error: Native APK output binary not found."
            exit 1
          fi

      - name: Create Single Fresh Git Tag
        run: |
          TAG_NAME="nyxos-android-latest"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Upload Native NyxOS APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nyxos-android-latest
          name: NyxOS Android (Native SwiftUI Build)
          files: output/NyxOS-Android.apk
          body: "Direct native Android APK compiled from the complete NyxOS SwiftUI codebase with Info.plist permission fixes."
