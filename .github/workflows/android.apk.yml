name: Build NyxOS Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Clean Build & Single Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Wipe All Duplicate Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="nyxos-android-latest"
          gh release delete "$TAG_NAME" --repo ${{ github.repository }} --yes || true
          git push origin --delete "$TAG_NAME" || true
          git tag -d "$TAG_NAME" || true

          for tag in $(git tag -l "v1.0-*"); do
            gh release delete "$tag" --repo ${{ github.repository }} --yes || true
            git push origin --delete "$tag" || true
            git tag -d "$tag" || true
          done

      - name: Generate Android Project & Match Exact NyxOS Design
        run: |
          mkdir -p app/src/main/java/com/nyxos/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.nyxos.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="NyxOS"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/nyxos/app/MainActivity.java
          package com.nyxos.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>NyxOS</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                  body, html { width: 100%; height: 100%; background: #030407; color: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; }

                  /* Mobile Phone Frame Wrapper */
                  .phone-wrapper {
                      width: 100%;
                      max-width: 380px;
                      height: 100%;
                      max-height: 760px;
                      background: radial-gradient(circle at center, #0e111a 0%, #030407 100%);
                      border-radius: 40px;
                      border: 1px solid rgba(0, 240, 255, 0.25);
                      box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
                      display: flex;
                      flex-direction: column;
                      justify-content: space-between;
                      padding: 24px 18px 20px 18px;
                      position: relative;
                  }

                  .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; opacity: 0.95; padding: 0 4px; }
                  .badge { background: rgba(0, 240, 255, 0.12); border: 1px solid rgba(0, 240, 255, 0.4); padding: 3px 10px; border-radius: 12px; font-size: 9px; color: #00f0ff; letter-spacing: 0.8px; font-weight: 800; }

                  .search-bar { margin: 18px 0 10px 0; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 12px; border-radius: 12px; font-size: 10px; color: #808b9e; display: flex; align-items: center; gap: 8px; }

                  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 6px 0; }
                  
                  .app-card {
                      background: rgba(255, 255, 255, 0.04);
                      border: 1px solid rgba(255, 255, 255, 0.08);
                      border-radius: 18px;
                      padding: 12px 6px;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      gap: 6px;
                      cursor: pointer;
                      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                      transition: transform 0.15s ease, background 0.15s ease;
                  }
                  .app-card:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.1); }
                  
                  .icon-box { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
                  .app-card span { font-size: 9px; font-weight: 600; color: #e2e8f0; text-align: center; }

                  /* Accent colors matching exact SwiftUI theme */
                  .c-cyan { color: #00f0ff; background: rgba(0, 240, 255, 0.12); border: 1px solid rgba(0, 240, 255, 0.3); }
                  .c-pink { color: #ff2a85; background: rgba(255, 42, 133, 0.12); border: 1px solid rgba(255, 42, 133, 0.3); }
                  .c-yellow { color: #ffc107; background: rgba(255, 193, 7, 0.12); border: 1px solid rgba(255, 193, 7, 0.3); }
                  .c-teal { color: #00e676; background: rgba(0, 230, 118, 0.12); border: 1px solid rgba(0, 230, 118, 0.3); }
                  .c-purple { color: #b388ff; background: rgba(179, 136, 255, 0.12); border: 1px solid rgba(179, 136, 255, 0.3); }
                  .c-orange { color: #ff9100; background: rgba(255, 145, 0, 0.12); border: 1px solid rgba(255, 145, 0, 0.3); }
                  .c-blue { color: #29b6f6; background: rgba(41, 182, 246, 0.12); border: 1px solid rgba(41, 182, 246, 0.3); }

                  .footer-text { text-align: center; font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 0.5px; }

                  /* In-App Window Overlay */
                  .window-overlay {
                      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                      background: rgba(8, 10, 16, 0.98);
                      border-radius: 38px;
                      padding: 24px 18px;
                      display: none;
                      flex-direction: column;
                      z-index: 50;
                  }
                  .window-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 14px; }
                  .window-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
                  .close-btn { background: none; border: none; color: #ff4d4d; font-size: 11px; font-weight: 800; cursor: pointer; }
                  .window-body { flex: 1; font-size: 11px; color: #94a3b8; line-height: 1.6; }
              </style>
          </head>
          <body>

              <div class="phone-wrapper">
                  <!-- Header / Status Bar -->
                  <div>
                      <div class="status-bar">
                          <span id="clock">8:34 PM</span>
                          <span class="badge">NYX OS STOCK</span>
                          <span>88% 🔋</span>
                      </div>

                      <div class="search-bar">
                          🔍 Search App Library...
                      </div>
                  </div>

                  <!-- 12 App Icons Grid Layout -->
                  <div class="grid">
                      <div class="app-card" onclick="openApp('Horizon', 'Secure Web Browsing Engine\nEnter any URL or download packages.', 'c-cyan', '🌍')">
                          <div class="icon-box c-cyan">🌍</div><span>Horizon</span>
                      </div>
                      <div class="app-card" onclick="openApp('Photos', 'Media Gallery & Capture Viewer\nView photos, screenshots, and video recordings.', 'c-pink', '🖼️')">
                          <div class="icon-box c-pink">🖼️</div><span>Photos</span>
                      </div>
                      <div class="app-card" onclick="openApp('Weather', 'Meteorological Environment Monitor\n32°C Sunny & Clear Conditions.', 'c-yellow', '⛅')">
                          <div class="icon-box c-yellow">⛅</div><span>Weather</span>
                      </div>
                      <div class="app-card" onclick="openApp('Locations', 'GPS Vector Tracker\nMonitoring precise latitude and longitude.', 'c-teal', '📍')">
                          <div class="icon-box c-teal">📍</div><span>Locations</span>
                      </div>
                      <div class="app-card" onclick="openApp('Aether Toolset', 'Aether Diagnostics & Root Terminal System.', 'c-teal', '💻')">
                          <div class="icon-box c-teal">💻</div><span>Aether Toolset</span>
                      </div>
                      <div class="app-card" onclick="openApp('App Store', 'Nyx App Store & Package Hub\nDownload custom apps and games.', 'c-orange', '✨')">
                          <div class="icon-box c-orange">✨</div><span>App Store</span>
                      </div>
                      <div class="app-card" onclick="openApp('Vault', 'Cryptographic Credential Manager\nStore passwords and secure notes.', 'c-purple', '🛡️')">
                          <div class="icon-box c-purple">🛡️</div><span>Vault</span>
                      </div>
                      <div class="app-card" onclick="openApp('Prism', 'OS Kernel & Theme Switcher\nSwitch between multi-OS environments.', 'c-purple', '🔮')">
                          <div class="icon-box c-purple">🔮</div><span>Prism</span>
                      </div>
                      <div class="app-card" onclick="openApp('Settings', 'System Configuration Hub\nManage language preferences and system settings.', 'c-blue', '⚙️')">
                          <div class="icon-box c-blue">⚙️</div><span>Settings</span>
                      </div>
                      <div class="app-card" onclick="openApp('Downloads', 'Download Manager & File System\nManage downloaded packages and files.', 'c-blue', '📥')">
                          <div class="icon-box c-blue">📥</div><span>Downloads</span>
                      </div>
                      <div class="app-card" onclick="openApp('Save Codes', 'Cloud Save Code Backup Hub\nExport and restore app configurations.', 'c-teal', '☁️')">
                          <div class="icon-box c-teal">☁️</div><span>Save Codes</span>
                      </div>
                      <div class="app-card" onclick="openApp('Qibla Tracker', 'Qibla Compass & Mecca Bearings\nFind precise prayer directions anywhere.', 'c-teal', '🧭')">
                          <div class="icon-box c-teal">🧭</div><span>Qibla Tracker</span>
                      </div>
                  </div>

                  <div class="footer-text">Meet NyxOS</div>

                  <!-- In-App View Overlay Container -->
                  <div class="window-overlay" id="appOverlay">
                      <div class="window-header">
                          <span class="window-title" id="overlayTitle" style="color: #00f0ff;">App Window</span>
                          <button class="close-btn" onclick="closeApp()">Close</button>
                      </div>
                      <div class="window-body" id="overlayBody"></div>
                  </div>
              </div>

              <script>
                  function openApp(title, desc, colorClass, icon) {
                      document.getElementById('overlayTitle').innerText = title;
                      document.getElementById('overlayBody').innerText = desc;
                      document.getElementById('appOverlay').style.display = 'flex';
                  }
                  function closeApp() {
                      document.getElementById('appOverlay').style.display = 'none';
                  }
                  setInterval(() => {
                      const now = new Date();
                      let h = now.getHours();
                      let m = now.getMinutes().toString().padStart(2, '0');
                      let ampm = h >= 12 ? 'PM' : 'AM';
                      h = h % 12 || 12;
                      document.getElementById('clock').innerText = `${h}:${m} ${ampm}`;
                  }, 1000);
              </script>

          </body>
          </html>
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.nyxos.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.nyxos.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NyxOS"
          include ':app'
          EOF

          echo "distributionBase=GRADLE_USER_HOME" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Create Tag
        run: |
          TAG_NAME="nyxos-android-latest"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Upload Clean Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nyxos-android-latest
          name: NyxOS Android v1.0.0 (Latest Build)
          files: app/build/outputs/apk/debug/app-debug.apk
          body: "Official clean release for `com.nyxos.app` with exact mobile frame alignment and hidden root text hints."
