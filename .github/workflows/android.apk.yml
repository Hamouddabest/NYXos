name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Swift & Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Swift Toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Swift Android SDK
        run: |
          swift sdk install https://source.skip.tools/swift-android-toolchain/releases/download/6.0.3/swift-6.0.3-RELEASE-android-24-0.1.artifactbundle.tar.gz --checksum 4566f23ae2d36dc5c02e915cd67d83b2af971faca4b2595fdd75cf0286acfac1

      - name: Check and Compile Swift Sources
        run: |
          if [ ! -f "Package.swift" ]; then
            echo "No Package.swift found. Creating dynamic Swift Package manifest..."
            swift package init --type library --name NyxOS
          fi

          swift build --swift-sdk aarch64-unknown-linux-android24 -c release

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android App Wrapper & Gradle Wrapper
        run: |
          mkdir -p android-app/app/src/main/java/com/nyxos/app
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a

          cp .build/aarch64-unknown-linux-android24/release/*.so android-app/app/src/main/jniLibs/arm64-v8a/ || true

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.nyxos.app">
              <application
                  android:label="NyxOS"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/nyxos/app/MainActivity.kt
          package com.nyxos.app

          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView

          class MainActivity : Activity() {
              companion object {
                  init {
                      System.loadLibrary("NyxOS")
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "NyxOS Running Natively on Android! 🚀"
                  tv.textSize = 22f
                  setContentView(tv)
              }
          }
          EOF

          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NyxOSApp"
          include ':app'
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              compileSdk 34
              namespace 'com.nyxos.app'
              defaultConfig {
                  applicationId "com.nyxos.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > android-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cd android-app
          # Use a stable gradle version directly via downloading the wrapper properties/jar to bypass gradle 9 incompatibility
          mkdir -p gradle/wrapper
          cat << 'EOT' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOT
          
          # Download gradle wrapper script
          wget https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -O gradlew
          chmod +x gradlew

      - name: Build Android APK
        run: |
          cd android-app
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyxOS-Android-App
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
