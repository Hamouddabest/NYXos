name: Build NyxOS Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Clean Build & Single Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Wipe All Duplicate Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="nyxos-android-latest"
          
          # Delete the release if it exists
          gh release delete "$TAG_NAME" --repo ${{ github.repository }} --yes || true
          
          # Delete remote tag if it exists
          git push origin --delete "$TAG_NAME" || true
          
          # Delete local tag if it exists
          git tag -d "$TAG_NAME" || true
          
          # Optional: Clean up older build tags to keep your repository pristine
          for tag in $(git tag -l "v1.0-*"); do
            gh release delete "$tag" --repo ${{ github.repository }} --yes || true
            git push origin --delete "$tag" || true
            git tag -d "$tag" || true
          done

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/nyxos/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # 1. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.nyxos.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="NyxOS"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. MainActivity.java (Loads full NyxOS web interface)
          cat << 'EOF' > app/src/main/java/com/nyxos/app/MainActivity.java
          package com.nyxos.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          # 3. Pull in your index.html interface asset
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "<h1 style='color:white;background:#030409;text-align:center;padding-top:40vh;'>NyxOS Loading...</h1>" > app/src/main/assets/index.html
          fi

          # 4. Gradle configuration files
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.nyxos.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.nyxos.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NyxOS"
          include ':app'
          EOF

          echo "distributionBase=GRADLE_USER_HOME" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Create Single Fresh Git Tag
        run: |
          TAG_NAME="nyxos-android-latest"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Upload to Single Clean Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nyxos-android-latest
          name: NyxOS Android (Latest Build)
          files: app/build/outputs/apk/debug/app-debug.apk
          body: "Clean single-release Android build for `com.nyxos.app` running the NyxOS interface."
