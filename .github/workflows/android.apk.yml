                              .onChanged { value in
                                  let deltaX = value.translation.width - lastDragLocation.width
                                  let deltaY = value.translation.height - lastDragLocation.height
                                  lastDragLocation = value.translation
                                  
                                  let maxX: CGFloat = viewModel.isLandscape ? 585 : 345
                                  let maxY: CGFloat = viewModel.isLandscape ? 335 : 575
                                  mousePosition = CGPoint(
                                      x: min(max(15, mousePosition.x + deltaX), maxX),
                                      y: min(max(20, mousePosition.y + deltaY), maxY)
                                  )
                              }
                              .onEnded { _ in
                                  lastDragLocation = .zero
                              }
                      )
                  }
              }
              
              private func openAppWindow(_ app: NyxApp) {
                  if !openWindows.contains(where: { $0.app == app }) {
                      openWindows.append(WindowItem(app: app, position: CGPoint(x: CGFloat.random(in: 130...190), y: CGFloat.random(in: 120...240)), size: CGSize(width: 260, height: 210)))
                  }
              }
              
              private func simulateMouseClick(at point: CGPoint) {
                  if point.x >= 15 && point.x <= 95 && point.y >= 520 && point.y <= 570 {
                      withAnimation { showStartMenu.toggle() }
                      return
                  }
                  
                  if showStartMenu && point.x >= 20 && point.x <= 270 && point.y >= 160 && point.y <= 420 {
                      let availableApps = NyxApp.allCases.filter { app in
                          let isRootApp = (app == .nyxManager || app == .nyxSign)
                          let allowed: Bool = {
                              if app == .nyxSign { return viewModel.showNyxSignUnlocked }
                              if isRootApp { return viewModel.isJailbroken }
                              return true
                          }()
                          return allowed
                      }
                      let index = Int((point.y - 180) / 45) * 2 + (point.x < 145 ? 0 : 1)
                      if index >= 0 && index < availableApps.count {
                          openAppWindow(availableApps[index])
                          showStartMenu = false
                      }
                      return
                  }
                  
                  for i in 0..<openWindows.count {
                      let win = openWindows[i]
                      let halfW = win.size.width / 2
                      let halfH = win.size.height / 2
                      let minX = win.position.x - halfW
                      let maxX = win.position.x + halfW
                      let minY = win.position.y - halfH
                      let maxY = win.position.y + halfH
                      
                      if point.x >= minX && point.x <= maxX && point.y >= minY && point.y <= maxY {
                          if point.y <= minY + 30 {
                              if point.x >= maxX - 25 {
                                  openWindows.remove(at: i)
                                  return
                              } else if point.x >= maxX - 50 {
                                  withAnimation {
                                      openWindows[i].size = openWindows[i].size.width < 230 ? CGSize(width: 280, height: 230) : CGSize(width: 170, height: 130)
                                  }
                                  return
                              }
                          }
                      }
                  }
                  
                  let desktopApps = NyxApp.allCases.filter { app in
                      let isRootApp = (app == .nyxManager || app == .nyxSign)
                      let allowed: Bool = {
                          if app == .nyxSign { return viewModel.showNyxSignUnlocked }
                          if isRootApp { return viewModel.isJailbroken }
                          return true
                      }()
                      return allowed
                  }
                  
                  if point.y >= 40 && point.y <= 320 {
                      let col = point.x < 180 ? 0 : 1
                      let row = Int((point.y - 40) / 75)
                      let index = row * 2 + col
                      if index >= 0 && index < desktopApps.count {
                          openAppWindow(desktopApps[index])
                      }
                  }
              }
          }

