                                                      .scaleEffect(scaleFactor)
                                                      .rotationEffect(.degrees(rotationAngle))
                                                      .clipShape(RoundedRectangle(cornerRadius: 12))
                                              }
                                          } else {
                                              Image(systemName: photo.type == "Recording" ? "video.fill" : "photo.fill")
                                                  .font(.system(size: 70))
                                                  .foregroundColor(.pink)
                                          }
                                          
                                          if photo.type == "Recording" && !isPlayingRecording {
                                              Button(action: {
                                                  audioEngine.playClickHaptic()
                                                  isPlayingRecording = true
                                                  playbackSeconds = 0
                                                  playbackTimer?.invalidate()
                                                  playbackTimer = Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true) { _ in
                                                      playbackSeconds += 1
                                                  }
                                              }) {
                                                  Circle()
                                                      .fill(Color.black.opacity(0.6))
                                                      .frame(width: 60, height: 60)
                                                      .overlay(Image(systemName: "play.fill").font(.system(size: 24)).foregroundColor(.white))
                                                      .shadow(radius: 10)
                                              }
                                          } else if photo.type == "Recording" && isPlayingRecording {
                                              VStack {
                                                  Spacer()
                                                  VStack(spacing: 6) {
                                                      HStack {
                                                          Image(systemName: "play.fill").font(.system(size: 8)).foregroundColor(.red)
                                                          Text("Playing Recording...")
                                                              .font(.system(size: 8, weight: .bold, design: .monospaced))
                                                              .foregroundColor(.white)
                                                          Spacer()
                                                          Text(formatTime(playbackSeconds))
                                                              .font(.system(size: 8, design: .monospaced))
                                                              .foregroundColor(.gray)
                                                      }
                                                      .padding(.horizontal, 20)
                                                  }
                                                  .padding(.vertical, 8)
                                                  .background(Color.black.opacity(0.85))
                                                  .clipShape(RoundedRectangle(cornerRadius: 12))
                                              }
                                              .padding(.bottom, 10)
                                          }
                                      }
                                      
                                      Text("Type: \(photo.type) • Created: \(photo.date.formatted(date: .omitted, time: .standard))")
                                          .font(.system(size: 9))
                                          .foregroundColor(.gray)
                                      
                                      Spacer()
                                  }
                                  .padding(.vertical, 30)
                              )
                      }
                  }
                  .sheet(isPresented: $showImagePicker) {
                      NativeImagePickerRepresentable { name, img in
                          viewModel.addImportedPhoto(name: name, image: img)
                      }
                  }
              }
              
              private func formatTime(_ totalSeconds: Int) -> String {
                  let minutes = totalSeconds / 60
                  let seconds = totalSeconds % 60
                  return String(format: "%d:%02d", minutes, seconds)
              }
          }

          struct NativeImagePickerRepresentable: UIViewControllerRepresentable {
              var onImagePicked: (String, UIImage) -> Void
              @Environment(\.presentationMode) var presentationMode
              
              func makeUIViewController(context: Context) -> PHPickerViewController {
                  var config = PHPickerConfiguration()
                  config.filter = .images
                  config.selectionLimit = 1
                  let picker = PHPickerViewController(configuration: config)
                  picker.delegate = context.coordinator
                  return picker
              }
              
              func updateUIViewController(_ uiView: PHPickerViewController, context: Context) {}
              
              func makeCoordinator() -> Coordinator {
                  Coordinator(self)
              }
              
              class Coordinator: NSObject, PHPickerViewControllerDelegate {
                  let parent: NativeImagePickerRepresentable
                  
                  init(_ parent: NativeImagePickerRepresentable) {
                      self.parent = parent
                  }
                  
                  func picker(_ picker: PHPickerViewController, didFinishPicking results: [PHPickerResult]) {
                      picker.dismiss(animated: true)
                      
                      guard let provider = results.first?.itemProvider, provider.canLoadObject(ofClass: UIImage.self) else {
                          return
                      }
                      
                      provider.loadObject(ofClass: UIImage.self) { image, error in
                          if let uiImage = image as? UIImage {
                              DispatchQueue.main.async {
                                  self.parent.onImagePicked("Photo \(Int.random(in: 100...999))", uiImage)
                              }
                          }
                      }
                  }
              }
          }

