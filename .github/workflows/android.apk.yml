              @Published var loggedInUserProvider: String = ""
              @Published var showAppByAppOnboarding: Bool = false
              @Published var onboardingAppIndex: Int = 0
              @Published var isLocked: Bool = false
              @Published var isScreenOn: Bool = true
              @Published var volumeLevel: Double = 0.5
              @Published var screenBrightness: Double = 0.95
              @Published var showVolumeHUD: Bool = false
              @Published var batteryLevel: Double = 0.88
              @Published var isCharging: Bool = false
              @Published var wifiEnabled: Bool = true
              @Published var bluetoothEnabled: Bool = true
              @Published var connectedBluetoothDevice: String = "AirPods Pro (Nyx)"
              @Published var flashlightEnabled: Bool = false
              @Published var activeApp: NyxApp? = nil
              @Published var activeStoreAppGame: StoreApp? = nil
              @Published var activeExeApp: StoreApp? = nil
              @Published var activeSideloadGame: SideloaderGame? = nil
              @Published var activeCustomAiApp: CustomAIApp? = nil
              @Published var isDesktopModeActive: Bool = false
              @Published var isControlCenterOpen: Bool = false
              @Published var isRecordingScreen: Bool = false
              @Published var triggerFlashAnimation: Bool = false
              @Published var currentLanguage: AppLanguage = .english
              @Published var osMode: OperatingSystemMode = .nyx
              @Published var systemAccentColor: Color = Color.cyan
              @Published var showVirtualKeyboard: Bool = false
              @Published var virtualKeyPressedOutput: String = "None"
              @Published var downloadedFiles: [DownloadedFileItem] = [
                  DownloadedFileItem(filename: "WelcomePackage.zip", filesize: "4.5 MB", date: Date())
              ]
              @Published var showDownloadsAppUnlocked: Bool = true
              @Published var showNyxSignUnlocked: Bool = false
              @Published var isJailbroken: Bool = false
              @Published var isRebooting: Bool = false
              @Published var showWindowsExeInstaller: Bool = false
              @Published var pendingExeFileName: String = ""
              @Published var hiddenApps: Set<String> = []
              @Published var deletedApps: Set<String> = []
              @Published var customAppIcons: [String: String] = [:]
              @Published var searchFilterText: String = ""
              @Published var selectedAiEngine: String = "Gemini"
              @Published var hideDynamicIslandBadge: Bool = false
              @Published var isCpuOverclocked: Bool = false
              @Published var customStatusBarLabel: String = ""
              @Published var isLightMode: Bool = false
              @Published var showAlertMessage: Bool = false
              @Published var alertTitleText: String = ""
              @Published var alertBodyText: String = ""
              
              @Published var vaultNotes: [VaultNote] = [
                  VaultNote(title: "Root Passwords", content: "nyx_admin_99#root", date: Date()),
                  VaultNote(title: "Crypto Wallet Seed", content: "orbit luxury crystal phantom matrix quantum code", date: Date())
              ]
              
              @Published var publishedTweaks: [PublishedTweak] = [
                  PublishedTweak(title: "KernelSpeed Pro", author: "NyxDev", description: "Unlocks core performance boost.", isEnabled: false),
                  PublishedTweak(title: "Utillity", author: "NyxRoot", description: "Hides the rooted status badge.", isEnabled: false),
                  PublishedTweak(title: "NyxSplit Multitasker", author: "NyxRoot", description: "Enables floating side-by-side multitasking.", isEnabled: false),
                  PublishedTweak(title: "Prism OS Expander", author: "NyxKernel", description: "Unlocks full iOS 18, Android, Windows & Linux OS switching.", isEnabled: false)
              ]
              
              @Published var photoGalleryItems: [PhotoMediaItem] = [
                  PhotoMediaItem(name: "Wallpaper Aurora", type: "Photo", date: Date()),
                  PhotoMediaItem(name: "System Snapshot 1", type: "Screenshot", date: Date()),
                  PhotoMediaItem(name: "Neon Skyline", type: "Photo", date: Date())
              ]
              
              @Published var customAiApps: [CustomAIApp] = []
              
              @Published var sideloadedGames: [SideloaderGame] = [
                  SideloaderGame(title: "Cyberpunk 2077 Mobile", format: ".ipa", size: "1.4 GB", isInstalledOnHomescreen: false),
                  SideloaderGame(title: "Minecraft Java Client", format: ".jar", size: "350 MB", isInstalledOnHomescreen: false)
              ]
              
              @Published var storeCatalog: [StoreApp] = [
                  StoreApp(name: "Roblox", icon: "cube.fill", description: "Metaverse Client Platform", accent: Color.red, isGame: true, isInstalled: false),
                  StoreApp(name: "Void Runner", icon: "gamecontroller.fill", description: "PC Action Platformer", accent: Color.orange, isGame: true, isInstalled: false)
              ]
              
              func login(provider: String) {
                  withAnimation {
                      isLoggedIn = true
                      loggedInUserProvider = provider
                      showAppByAppOnboarding = true
                      onboardingAppIndex = 0
                  }
              }
              
              func unlockDevice() {
                  withAnimation { isLocked = false }
              }
              
              func switchOS(to mode: OperatingSystemMode) {
                  withAnimation(.easeInOut(duration: 0.5)) {
                      osMode = mode
                      systemAccentColor = mode.accent
                      if mode == .windows || mode == .linux {
                          isDesktopModeActive = true
                      }
                  }
              }
              
              func generateSaveCode() -> String {
                  do {
                      let data = try JSONEncoder().encode(customAiApps)
                      return data.base64EncodedString()
                  } catch {
                      return "NYX-EMPTY-CODE"
                  }
              }
              
              func takeScreenshot() {
                  withAnimation(.easeOut(duration: 0.15)) { triggerFlashAnimation = true }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.2) {
                      withAnimation { self.triggerFlashAnimation = false }
                  }
                  
                  let capturedImage: UIImage? = {
                      guard let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                            let window = scene.windows.first else { return nil }
                      let renderer = UIGraphicsImageRenderer(bounds: window.bounds)
                      return renderer.image { _ in
                          window.drawHierarchy(in: window.bounds, afterScreenUpdates: true)
                      }
                  }()
                  
                  let shotName = "Screenshot \(Date().formatted(date: .omitted, time: .standard))"
                  let newShot = PhotoMediaItem(name: shotName, type: "Screenshot", date: Date(), image: capturedImage)
                  photoGalleryItems.insert(newShot, at: 0)
                  
                  let downloadItem = DownloadedFileItem(filename: "\(shotName).png", filesize: "3.2 MB", date: Date())
                  downloadedFiles.insert(downloadItem, at: 0)
              }
              
              func deletePhoto(id: UUID) {
                  photoGalleryItems.removeAll(where: { $0.id == id })
              }
              
              func addImportedPhoto(name: String, image: UIImage) {
                  let newPhoto = PhotoMediaItem(name: name, type: "Imported", date: Date(), image: image)
                  photoGalleryItems.insert(newPhoto, at: 0)
              }
              
              func toggleScreenRecording() {
                  if isRecordingScreen {
                      isRecordingScreen = false
                      
                      let capturedImage: UIImage? = {
                          guard let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                                let window = scene.windows.first else { return nil }
                      let renderer = UIGraphicsImageRenderer(bounds: window.bounds)
                      return renderer.image { _ in
                          window.drawHierarchy(in: window.bounds, afterScreenUpdates: true)
                      }
                      }()
                      
                      let recName = "Screen Rec \(Date().formatted(date: .omitted, time: .standard))"
                      let rec = PhotoMediaItem(name: recName, type: "Recording", date: Date(), image: capturedImage)
                      photoGalleryItems.insert(rec, at: 0)
                      
                      let downloadItem = DownloadedFileItem(filename: "\(recName).mp4", filesize: "450.0 MB", date: Date())
                      downloadedFiles.insert(downloadItem, at: 0)
                  } else {
                      isRecordingScreen = true
                  }
              }
              
              func triggerJailbreakReboot() {
                  withAnimation { isRebooting = true }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 3.5) {
                      withAnimation {
                          self.isJailbroken = true
                          self.osMode = .ios18
                          self.systemAccentColor = OperatingSystemMode.ios18.accent
                          self.isRebooting = false
                      }
                  }
              }
              
              func triggerRemoveJailbreakReboot() {
                  withAnimation { isRebooting = true }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 3.5) {
                      withAnimation {
                          self.isJailbroken = false
                          self.isCpuOverclocked = false
                          self.isDesktopModeActive = false
                          self.osMode = .nyx
                          self.systemAccentColor = OperatingSystemMode.nyx.accent
                          for i in 0..<self.publishedTweaks.count {
                              self.publishedTweaks[i].isEnabled = false
                          }
                          self.isRebooting = false
                      }
                  }
              }
              
              func publishCustomTweak(title: String, desc: String) {
                  let newTweak = PublishedTweak(title: title, author: "RootUser", description: desc, isEnabled: false)
                  publishedTweaks.append(newTweak)
              }
              
              func sideloadAndInstallGame(id: UUID) {
                  if let index = sideloadedGames.firstIndex(where: { $0.id == id }) {
                      sideloadedGames[index].isInstalledOnHomescreen = true
                  }
              }
              
              func installStoreApp(id: UUID) {
                  if let index = storeCatalog.firstIndex(where: { $0.id == id }) {
                      storeCatalog[index].isInstalled = true
                  }
              }
              
              func addDownloadedFileFromHorizon(filename: String) {
                  let newItem = DownloadedFileItem(filename: filename, filesize: "12.4 MB", date: Date())
                  downloadedFiles.insert(newItem, at: 0)
              }
              
              func openDownloadedFile(item: DownloadedFileItem) {
                  let fname = item.filename.lowercased()
                  if fname.hasSuffix(".exe") {
                      pendingExeFileName = item.filename
                      showWindowsExeInstaller = true
                  } else if fname.hasSuffix(".ipa") || fname.hasSuffix(".apk") || fname.hasSuffix(".jar") {
                      let title = item.filename.replacingOccurrences(of: ".ipa", with: "").replacingOccurrences(of: ".apk", with: "").replacingOccurrences(of: ".jar", with: "").capitalized
                      sideloadedGames.append(SideloaderGame(title: title, format: fname.hasSuffix(".ipa") ? ".ipa" : ".apk", size: item.filesize, isInstalledOnHomescreen: true))
                      alertTitleText = "Package Installed"
                      alertBodyText = "\(item.filename) has been successfully sideloaded and installed to your home screen!"
                      showAlertMessage = true
                  } else if fname.hasSuffix(".html") || fname.hasSuffix(".htm") {
                      activeApp = .browser
                  } else {
                      alertTitleText = "File Opened"
                      alertBodyText = "Successfully parsed and opened \(item.filename)."
                      showAlertMessage = true
                  }
              }
              
              func confirmWindowsInstallation() {
                  showWindowsExeInstaller = false
                  let cleanName = pendingExeFileName.replacingOccurrences(of: ".exe", with: "", options: .caseInsensitive).capitalized
                  let newApp = StoreApp(name: cleanName, icon: "cube.box.fill", description: "Win32 Executable Application", accent: Color.blue, isGame: false, isInstalled: true, isExeApp: true, exeFilename: pendingExeFileName)
                  storeCatalog.append(newApp)
                  activeExeApp = newApp
                  pendingExeFileName = ""
              }
              
              func addVaultNote(title: String, content: String) {
                  let note = VaultNote(title: title, content: content, date: Date())
                  vaultNotes.append(note)
              }
          }

