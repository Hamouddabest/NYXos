name: Build NyxOS Android APK from SwiftUI

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Cross-Compile SwiftUI to Native Android APK
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Skip (SwiftUI to Kotlin/Android Transpiler)
        run: |
          brew install skiptools/skip/skip
          skip check

      - name: Clean Up Previous Release & Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="nyxos-android-latest"
          gh release delete "$TAG_NAME" --repo ${{ github.repository }} --yes || true
          git push origin --delete "$TAG_NAME" || true
          git tag -d "$TAG_NAME" || true

      - name: Transpile SwiftUI and Build Android Debug APK
        run: |
          # Build Android target using Skip / Gradle
          skip gradle assembleDebug

      - name: Locate and Stage Compiled APK
        run: |
          mkdir -p output
          FOUND_APK=$(find . -name "*debug*.apk" -type f | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" output/NyxOS-Android.apk
            echo "Successfully packaged: output/NyxOS-Android.apk"
          else
            echo "Error: APK build failed to output binary."
            exit 1
          fi

      - name: Create Fresh Git Tag
        run: |
          TAG_NAME="nyxos-android-latest"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Upload Native NyxOS APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nyxos-android-latest
          name: NyxOS Android (Native SwiftUI Build)
          files: output/NyxOS-Android.apk
          body: "Direct native Android APK transpiled from NyxOS SwiftUI source code."
