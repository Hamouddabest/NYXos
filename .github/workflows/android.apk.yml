name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Instant Android Build & Sign
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Up Existing Release & Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="nyxos-android-latest"
          gh release delete "$TAG_NAME" --repo ${{ github.repository }} --yes || true
          git push origin --delete "$TAG_NAME" || true
          git tag -d "$TAG_NAME" || true

      - name: Generate Android Project Structure & Compile APK
        run: |
          # Create standard Android project directory layout
          mkdir -p app/src/main/java/com/nyxos/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # 1. Create AndroidManifest.xml for com.nyxos.app
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.nyxos.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="NyxOS"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. Create MainActivity.java to load the UI cleanly without crashing
          cat << 'EOF' > app/src/main/java/com/nyxos/app/MainActivity.java
          package com.nyxos.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          # 3. Bring in your index.html web UI as the core app interface asset
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "<h1 style='color:white;background:#0d0d0f;text-align:center;padding-top:40vh;'>NyxOS Android Loader</h1>" > app/src/main/assets/index.html
          fi

          # 4. Create build.gradle configuration for the app module
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.nyxos.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.nyxos.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 5. Create project-level build files & gradle settings
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "NyxOS"
          include ':app'
          EOF

          echo "distributionBase=GRADLE_USER_HOME" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          # Download Gradle wrapper files to compile automatically
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

          # Build the debug APK
          ./gradlew assembleDebug --no-daemon

      - name: Create and Push Fresh Git Tag
        run: |
          TAG_NAME="nyxos-android-latest"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Upload Clean APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nyxos-android-latest
          name: NyxOS Android (Latest Build)
          files: app/build/outputs/apk/debug/app-debug.apk
          body: "Fully compiled native APK for `com.nyxos.app` with embedded web simulator interface."
