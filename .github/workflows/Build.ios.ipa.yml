name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Instant Linux Build & Sign
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete Duplicate Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="ios-v1.0-${{ github.run_number }}"
          
          # Delete existing release if it exists
          gh release delete "$TAG_NAME" --repo ${{ github.repository }} --yes || true
          
          # Delete existing remote tag if it exists
          git push origin --delete "$TAG_NAME" || true
          
          # Delete local tag if it exists
          git tag -d "$TAG_NAME" || true

      - name: Generate & Package iOS App IPA
        run: |
          mkdir -p Payload/NyxOS.app

          # Generate a clean arm64 Mach-O binary via Python
          python3 -c '
          import struct
          header = struct.pack("<IIIIIII", 
              0xfeedfacf, 0x0100000c, 0x00000000, 0x00000002, 0, 0, 0
          )
          code = struct.pack("<III", 0xd2800000, 0xd2800020, 0xd4000001)
          with open("Payload/NyxOS.app/NyxOS", "wb") as f:
              f.write(header + b"\x00" * 24 + code)
          '
          
          chmod +x Payload/NyxOS.app/NyxOS

          # Write fully compliant Info.plist for com.nyxos.app
          cat << 'EOF' > Payload/NyxOS.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>NyxOS</string>
              <key>CFBundleIdentifier</key>
              <string>com.nyxos.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>NyxOS</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
          </dict>
          </plist>
          EOF

          # Compress cleanly into the final .ipa
          zip -r NyxOS-iOS.ipa Payload

      - name: Create and Push Git Tag
        run: |
          TAG_NAME="ios-v1.0-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0-${{ github.run_number }}
          name: NyxOS iOS v1.0 (Build ${{ github.run_number }})
          files: NyxOS-iOS.ipa
          body: "Instant Linux build for `com.nyxos.app` with automatic duplicate cleanup."
