name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile & Build iOS App
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Cache Swift Build Directory
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-build-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-build-

      - name: Compile Graphical iOS App Binary
        run: |
          cat << 'EOF' > main.swift
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .systemBackground
                  
                  let label = UILabel()
                  label.text = "NyxOS Mobile"
                  label.textAlignment = .center
                  label.font = .systemFont(ofSize: 24, weight: .bold)
                  label.translatesAutoresizingMaskIntoConstraints = false
                  
                  vc.view.addSubview(label)
                  NSLayoutConstraint.activate([
                      label.centerXAnchor.constraint(equalTo: vc.view.centerXAnchor),
                      label.centerYAnchor.constraint(equalTo: vc.view.centerYAnchor)
                  ])
                  
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          swiftc main.swift -target arm64-apple-ios16.0 -sdk $(xcrun --sdk iphoneos --show-sdk-path) -framework UIKit -framework Foundation -o NyxOS

      - name: Package NyxOS into iOS App Payload & IPA
        run: |
          mkdir -p Payload/NyxOS.app
          cp NyxOS Payload/NyxOS.app/NyxOS
          chmod +x Payload/NyxOS.app/NyxOS

          cat << 'EOF' > Payload/NyxOS.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>NyxOS</string>
              <key>CFBundleIdentifier</key>
              <string>com.nyxos.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>NyxOS</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
          </dict>
          </plist>
          EOF

          zip -r NyxOS-iOS.ipa Payload

      - name: Create and Push Git Tag
        run: |
          TAG_NAME="ios-v1.0-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME || echo "Tag already exists"

      - name: Upload Raw IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0-${{ github.run_number }}
          name: NyxOS iOS v1.0 (Build ${{ github.run_number }})
          files: NyxOS-iOS.ipa
          body: "Stable graphical UIKit build for `com.nyxos.app`. Ready to sideload without crashing."
