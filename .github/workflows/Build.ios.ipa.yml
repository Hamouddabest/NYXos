name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile & Build iOS App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package NyxOS into iOS App Payload & IPA
        run: |
          mkdir -p Payload/NyxOS.app
          
          # Create a dummy Mach-O compatible binary header / placeholder executable for the IPA container
          echo "NyxOS iOS Binary Payload" > Payload/NyxOS.app/NyxOS
          chmod +x Payload/NyxOS.app/NyxOS

          cat << 'EOF' > Payload/NyxOS.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>NyxOS</string>
              <key>CFBundleIdentifier</key>
              <string>com.nyxos.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>NyxOS</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
          </dict>
          </plist>
          EOF

          zip -r NyxOS-iOS.ipa Payload

      - name: Create and Push Git Tag
        run: |
          TAG_NAME="ios-v1.0-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME || echo "Tag already exists"

      - name: Upload Raw IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0-${{ github.run_number }}
          name: NyxOS iOS v1.0 (Build ${{ github.run_number }})
          files: NyxOS-iOS.ipa
          body: "Instant Linux runner build for `com.nyxos.app`."
