name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Instant Linux Build & Sign
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Up Existing Release & Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="nyxos-ios-latest"
          gh release delete "$TAG_NAME" --repo ${{ github.repository }} --yes || true
          git push origin --delete "$TAG_NAME" || true
          git tag -d "$TAG_NAME" || true

      - name: Install Zig & Compile Valid iOS Mach-O Binary
        run: |
          sudo apt-get update
          sudo apt-get install -y zig zip

          mkdir -p Payload/NyxOS.app

          echo 'int main() { return 0; }' > main.c

          # Cross-compile using correct Zig 0.14 iOS target query
          zig cc -target aarch64-ios main.c -o Payload/NyxOS.app/NyxOS
          chmod +x Payload/NyxOS.app/NyxOS

          cat << 'EOF' > Payload/NyxOS.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>NyxOS</string>
              <key>CFBundleIdentifier</key>
              <string>com.nyxos.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>NyxOS</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
          </dict>
          </plist>
          EOF

          zip -r NyxOS-iOS.ipa Payload

      - name: Create and Push Fresh Git Tag
        run: |
          TAG_NAME="nyxos-ios-latest"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Upload Clean IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nyxos-ios-latest
          name: NyxOS iOS (Latest Build)
          files: NyxOS-iOS.ipa
          body: "Stable sideloadable build for `com.nyxos.app` compiled via Zig."
