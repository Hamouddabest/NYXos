name: Build NyxOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Package NyxOS IPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Package App
        run: |
          echo "Checking workspace files..."
          ls -la
          
          if [ -f "nyxos.zip" ]; then
            mkdir -p extracted_nyx
            unzip -q nyxos.zip -d extracted_nyx
          else
            echo "Error: nyxos.zip not found in repository root!"
            exit 1
          fi

          mkdir -p Payload/NyxOS.app
          cp -r extracted_nyx/* Payload/NyxOS.app/

          if [ ! -f "Payload/NyxOS.app/Info.plist" ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.nyxos.mobileapp</string><key>CFBundleName</key><string>NyxOS</string><key>CFBundleVersion</key><string>18.4.2</string><key>CFBundleShortVersionString</key><string>18.4.2</string><key>MinimumOSVersion</key><string>15.0</string><key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array></dict></plist>' > Payload/NyxOS.app/Info.plist
          fi

          zip -qr NyxOS-Package.ipa Payload
          echo "Successfully packaged NyxOS-Package.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyxOS-Release-IPA
          path: NyxOS-Package.ipa
