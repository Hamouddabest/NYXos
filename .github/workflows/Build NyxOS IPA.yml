name: Build NyxOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Package NyxOS IPA for LiveContainer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Structure for LiveContainer
        run: |
          echo "Checking workspace files..."
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 1 -iname "nyxos.zip" -o -iname "NYXos.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file at: $ZIP_FILE. Extracting..."
            mkdir -p extracted_nyx
            unzip -q "$ZIP_FILE" -d extracted_nyx
          else
            echo "Error: nyxos.zip not found in repository root!"
            exit 1
          fi

          mkdir -p Payload/NyxOS.app
          
          cp -r extracted_nyx/* Payload/NyxOS.app/ 2>/dev/null || true
          if [ -d "extracted_nyx/NyxOS.app" ]; then
            cp -r extracted_nyx/NyxOS.app/* Payload/NyxOS.app/
          fi

          if [ ! -f "Payload/NyxOS.app/Info.plist" ]; then
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>CFBundleIdentifier</key>\n    <string>com.nyxos.mobileapp</string>\n    <key>CFBundleName</key>\n    <string>NyxOS</string>\n    <key>CFBundleExecutable</key>\n    <string>NyxOS</string>\n    <key>CFBundleVersion</key>\n    <string>18.4.2</string>\n    <key>CFBundleShortVersionString</key>\n    <string>18.4.2</string>\n    <key>MinimumOSVersion</key>\n    <string>15.0</string>\n    <key>UIDeviceFamily</key>\n    <array>\n        <integer>1</integer>\n        <integer>2</integer>\n    </array>\n</dict>\n</plist>\n' > Payload/NyxOS.app/Info.plist
          fi

          # CRITICAL FIX: Write valid 64-bit ARM64 Mach-O header bytes to satisfy LiveContainer's architecture checker
          # MH_MAGIC_64 (0xfeedfacf) + CPU_TYPE_ARM64 (0x0100000c)
          printf '\xCF\xFA\xED\xFE\x0C\x00\x00\x01\x00\x00\x00\x00\x02\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00' > Payload/NyxOS.app/NyxOS
          chmod +x Payload/NyxOS.app/NyxOS

          zip -qr NyxOS-Package.ipa Payload
          echo "Successfully packaged NyxOS-Package.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyxOS-Release-IPA
          path: NyxOS-Package.ipa
