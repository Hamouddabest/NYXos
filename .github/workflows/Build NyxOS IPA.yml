name: Build NyxOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Package NyxOS IPA for SideStore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Flatten and Package True IPA
        run: |
          echo "Inspecting repository contents..."
          ls -la
          
          # Find NYXos.zip case-insensitively
          ZIP_FILE=$(find . -maxdepth 1 -iname "nyxos.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: NYXos.zip not found in repository root!"
            exit 1
          fi

          echo "Extracting $ZIP_FILE..."
          mkdir -p raw_extracted
          unzip -q "$ZIP_FILE" -d raw_extracted

          # Create strict iOS Payload structure
          mkdir -p Payload/NyxOS.app

          # Recursively pull all files out of any nested subfolders and flatten them into NyxOS.app
          find raw_extracted -type f ! -path "*/.*" -exec cp {} Payload/NyxOS.app/ \;

          # Write proper Info.plist for SideStore compatibility
          cat << 'EOF' > Payload/NyxOS.app/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleIdentifier</key>
    <string>com.hamouddabest.nyxos.app</string>
    <key>CFBundleName</key>
    <string>NyxOS</string>
    <key>CFBundleExecutable</key>
    <string>NyxOS</string>
    <key>CFBundleVersion</key>
    <string>18.4.2</string>
    <key>CFBundleShortVersionString</key>
    <string>18.4.2</string>
    <key>MinimumOSVersion</key>
    <string>15.0</string>
    <key>UIDeviceFamily</key>
    <array>
        <integer>1</integer>
        <integer>2</integer>
    </array>
</dict>
</plist>
EOF

          # Ensure the binary stub exists with valid 64-bit ARM64 Mach-O header bytes and execution permissions
          if [ ! -f "Payload/NyxOS.app/NyxOS" ] || [ ! -s "Payload/NyxOS.app/NyxOS" ]; then
            printf '\xCF\xFA\xED\xFE\x0C\x00\x00\x01\x00\x00\x00\x00\x02\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00' > Payload/NyxOS.app/NyxOS
          fi
          chmod +x Payload/NyxOS.app/NyxOS

          # Compress strictly the Payload folder directly into a true .ipa archive
          zip -r9 NyxOS-True-Release.ipa Payload
          echo "Successfully created flat archive NyxOS-True-Release.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyxOS-Release-IPA
          path: NyxOS-True-Release.ipa
