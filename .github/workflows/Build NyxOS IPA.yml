name: Build NyxOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Package NyxOS IPA for SideStore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Flatten and Package True IPA
        run: |
          set -e
          echo "Inspecting repository contents..."
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 1 -iname "nyxos.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -iname "NYXos.zip" | head -n 1)
          fi
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: NYXos.zip not found in repository root!"
            exit 1
          fi

          echo "Extracting $ZIP_FILE..."
          mkdir -p raw_extracted
          unzip -q "$ZIP_FILE" -d raw_extracted

          mkdir -p Payload/NyxOS.app
          find raw_extracted -type f ! -path "*/.*" -exec cp {} Payload/NyxOS.app/ \;

          echo "Writing Info.plist..."
          printf '<?xml version="1.0" encoding="UTF-8"?>\n' > Payload/NyxOS.app/Info.plist
          printf '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n' >> Payload/NyxOS.app/Info.plist
          printf '<plist version="1.0">\n' >> Payload/NyxOS.app/Info.plist
          printf '<dict>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <key>CFBundleIdentifier</key>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <string>com.hamouddabest.nyxos.app</string>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <key>CFBundleName</key>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <string>NyxOS</string>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <key>CFBundleExecutable</key>\n    <string>NyxOS</string>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <key>CFBundleVersion</key>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <string>18.4.2</string>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <key>CFBundleShortVersionString</key>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <string>18.4.2</string>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <key>MinimumOSVersion</key>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <string>15.0</string>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <key>UIDeviceFamily</key>\n' >> Payload/NyxOS.app/Info.plist
          printf '    <array>\n        <integer>1</integer>\n        <integer>2</integer>\n    </array>\n' >> Payload/NyxOS.app/Info.plist
          printf '</dict>\n' >> Payload/NyxOS.app/Info.plist
          printf '</plist>\n' >> Payload/NyxOS.app/Info.plist

          if [ ! -f "Payload/NyxOS.app/NyxOS" ] || [ ! -s "Payload/NyxOS.app/NyxOS" ]; then
            printf '\xCF\xFA\xED\xFE\x0C\x00\x00\x01\x00\x00\x00\x00\x02\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00' > Payload/NyxOS.app/NyxOS
          fi
          chmod +x Payload/NyxOS.app/NyxOS

          zip -r9 NyxOS.ipa Payload
          echo "Successfully created NyxOS.ipa"

      - name: Upload Uncompressed IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: NyxOS.ipa
          path: NyxOS.ipa
